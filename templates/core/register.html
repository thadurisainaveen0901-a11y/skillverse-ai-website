{% extends 'core/base.html' %}

{% block title %}Register - SkillVerse AI{% endblock %}

{% block content %}
<section class="page-section">
    <div class="page-bg">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
    </div>
    <div class="page-container">
        <div class="liquid-card" style="max-width: 440px; margin: 0 auto; padding: 3rem;" data-tilt>
            <div style="text-align: center; margin-bottom: 2rem;">
                <div class="logo-icon" style="width: 56px; height: 56px; font-size: 1.5rem; margin: 0 auto 1rem; border-radius: 16px;">
                    <i class="fas fa-brain"></i>
                </div>
                <h1 style="font-family: var(--font-primary); font-size: 1.75rem; font-weight: 800; margin-bottom: 0.5rem;">Create Account</h1>
                <p style="color: var(--text-secondary);">Start your journey to career success</p>
            </div>
            <div id="errorMessage" style="display:none; padding: 1rem; background: rgba(255,59,48,0.1); color: var(--danger); border-radius: var(--radius-md); margin-bottom: 1rem; text-align: center;"></div>
            <div id="successMessage" style="display:none; padding: 1rem; background: rgba(52,199,89,0.1); color: var(--success); border-radius: var(--radius-md); margin-bottom: 1rem; text-align: center;"></div>
            <form id="registerForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="regName" placeholder="Enter your full name" required style="padding: 1rem 1.25rem;">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" placeholder="Enter your email" required style="padding: 1rem 1.25rem;">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" placeholder="Create a password (min 6 characters)" required style="padding: 1rem 1.25rem;">
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="regConfirmPassword" placeholder="Confirm your password" required style="padding: 1rem 1.25rem;">
                </div>
                <button type="submit" class="btn btn-primary btn-lg btn-full" id="registerBtn">
                    <i class="fas fa-user-plus"></i>
                    <span>Create Account</span>
                </button>
            </form>
            <div style="text-align: center; margin-top: 1.5rem;">
                <p style="color: var(--text-secondary); font-size: 0.9rem;">
                    Already have an account? <a href="/login/" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign In</a>
                </p>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_scripts %}
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('registerBtn');
    const errorDiv = document.getElementById('errorMessage');
    const successDiv = document.getElementById('successMessage');
    errorDiv.style.display = 'none';
    successDiv.style.display = 'none';

    const fullName = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const confirmPassword = document.getElementById('regConfirmPassword').value;

    if (!fullName || !email || !password) {
        errorDiv.textContent = 'All fields are required';
        errorDiv.style.display = 'block';
        return;
    }
    if (password.length < 6) {
        errorDiv.textContent = 'Password must be at least 6 characters';
        errorDiv.style.display = 'block';
        return;
    }
    if (password !== confirmPassword) {
        errorDiv.textContent = 'Passwords do not match';
        errorDiv.style.display = 'block';
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';

    try {
        const response = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: email.split('@')[0], email, password, full_name: fullName })
        });
        const data = await response.json();
        if (response.ok) {
            localStorage.setItem('user', JSON.stringify(data.user));
            successDiv.textContent = 'Account created successfully! Redirecting...';
            successDiv.style.display = 'block';
            setTimeout(() => window.location.href = '/dashboard/', 1000);
        } else {
            errorDiv.textContent = data.error || 'Registration failed';
            errorDiv.style.display = 'block';
        }
    } catch (err) {
        errorDiv.textContent = 'Network error. Please try again.';
        errorDiv.style.display = 'block';
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-user-plus"></i><span>Create Account</span>';
    }
});
</script>
{% endblock %}
