{% extends 'core/base.html' %}

{% block title %}Login - SkillVerse AI{% endblock %}

{% block content %}
<section class="page-section">
    <div class="page-bg">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
    </div>
    <div class="page-container">
        <div class="liquid-card" style="max-width: 440px; margin: 0 auto; padding: 3rem;" data-tilt>
            <div style="text-align: center; margin-bottom: 2rem;">
                <div class="logo-icon" style="width: 56px; height: 56px; font-size: 1.5rem; margin: 0 auto 1rem; border-radius: 16px;">
                    <i class="fas fa-brain"></i>
                </div>
                <h1 style="font-family: var(--font-primary); font-size: 1.75rem; font-weight: 800; margin-bottom: 0.5rem;">Welcome Back</h1>
                <p style="color: var(--text-secondary);">Sign in to your account to continue</p>
            </div>
            <div id="errorMessage" style="display:none; padding: 1rem; background: rgba(255,59,48,0.1); color: var(--danger); border-radius: var(--radius-md); margin-bottom: 1rem; text-align: center;"></div>
            <div id="successMessage" style="display:none; padding: 1rem; background: rgba(52,199,89,0.1); color: var(--success); border-radius: var(--radius-md); margin-bottom: 1rem; text-align: center;"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email or Username</label>
                    <input type="text" id="loginUsername" placeholder="Enter email or username" required style="padding: 1rem 1.25rem;">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required style="padding: 1rem 1.25rem;">
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; color: var(--text-secondary);">
                        <input type="checkbox" style="width: auto;"> Remember me
                    </label>
                    <a href="/help-center/" style="color: var(--primary); font-size: 0.9rem; font-weight: 600; text-decoration: none;">Forgot password?</a>
                </div>
                <button type="submit" class="btn btn-primary btn-lg btn-full" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>Sign In</span>
                </button>
            </form>
            <div style="text-align: center; margin-top: 1.5rem;">
                <p style="color: var(--text-secondary); font-size: 0.9rem;">
                    Don't have an account? <a href="/register/" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign Up</a>
                </p>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_scripts %}
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const errorDiv = document.getElementById('errorMessage');
    const successDiv = document.getElementById('successMessage');
    errorDiv.style.display = 'none';
    successDiv.style.display = 'none';

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing In...';

    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;

    try {
        const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await response.json();
        if (response.ok) {
            localStorage.setItem('user', JSON.stringify(data.user));
            successDiv.textContent = 'Login successful! Redirecting...';
            successDiv.style.display = 'block';
            setTimeout(() => window.location.href = '/dashboard/', 1000);
        } else {
            errorDiv.textContent = data.error || 'Login failed';
            errorDiv.style.display = 'block';
        }
    } catch (err) {
        errorDiv.textContent = 'Network error. Please try again.';
        errorDiv.style.display = 'block';
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>Sign In</span>';
    }
});
</script>
{% endblock %}
