{% extends 'admin_app/base.html' %}

{% block title %}Admin Login - SkillVerse AI{% endblock %}

{% block content %}
<div class="admin-login-container">
    <div class="admin-login-card" style="position: relative;">
        <div class="admin-login-logo">
            <div class="admin-logo-icon">
                <i class="fas fa-shield-halved"></i>
            </div>
            <h1>Skill<span>Verse</span> AI</h1>
            <p>Admin Control Panel</p>
        </div>
        <button class="admin-theme-toggle" id="adminThemeToggle" aria-label="Toggle dark mode" style="position: absolute; top: 1.5rem; right: 1.5rem;">
            <i class="fas fa-moon"></i>
        </button>

        {% if messages %}
            {% for message in messages %}
                <div class="admin-alert admin-alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'admin_login' %}">
            {% csrf_token %}
            <div class="admin-form-group">
                <label class="admin-form-label">Username</label>
                <input type="text" name="username" class="admin-form-input" placeholder="Enter admin username" required>
            </div>
            <div class="admin-form-group">
                <label class="admin-form-label">Password</label>
                <input type="password" name="password" class="admin-form-input" placeholder="Enter admin password" required>
            </div>
            <button type="submit" class="admin-btn admin-btn-primary admin-btn-full admin-btn-lg">
                <i class="fas fa-lock"></i>
                Sign In to Admin
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem;">
            <a href="{% url 'home' %}" style="color: var(--text-tertiary); font-size: 0.85rem; text-decoration: none;">
                <i class="fas fa-arrow-left"></i> Back to Website
            </a>
        </div>
    </div>
</div>

<script>
    gsap.from('.admin-login-card', {
        opacity: 0,
        y: 30,
        duration: 0.8,
        ease: 'power3.out'
    });
</script>
{% endblock %}
